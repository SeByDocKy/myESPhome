substitutions:
  name: 'test_hm_hms_hmsw'
  my_hours: '23'
  my_minute: '59'
  my_second: '59'

esphome:
  name: ${name}
  min_version: 2026.7.0
  
esp32:
  #board: esp32-s3-devkitc-1
  board: esp32dev
  cpu_frequency: 240Mhz
  # toolchain: platformio
  framework:
    type: esp-idf
    version: 'dev'
    
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
api:
  batch_delay: 50ms
  
ota:
  - platform: esphome


time:
  - platform: sntp
    id: my_time
      
      
logger:
  # hardware_uart: USB_SERIAL_JTAG
   level: verbose #debug
   
debug:
  update_interval: 5s
  
  
sensor:
  - platform: wifi_signal
    name: ${name}_wifi_power
    id: wifi_power
    update_interval: 5s

  - platform: uptime
    id: uptime_sec

  - platform: debug
    free:
      name: ${name}_heap_free
    loop_time:
      name: ${name}_loop_time  
      
text_sensor:
   
  - platform: template
    name: ${name}_uptime
    lambda: |-
      int seconds = (id(uptime_sec).state);
      int days = seconds / (24 * 3600);
      seconds = seconds % (24 * 3600); 
      int hours = seconds / 3600;
      seconds = seconds % 3600;
      int minutes = seconds /  60;
      seconds = seconds % 60;
      if ( days ) {
        return { (std::to_string(days) +"d " + std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( hours ) {
        return { (std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( minutes ) {
        return { (std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else {
        return { (std::to_string(seconds) +"s ").c_str() };
      }  
    icon: mdi:clock-start
    update_interval: 113s      
  
packages:

  cmt2300a:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_cmt2300a.yaml'
        vars:
          cmt2300a_id: 'cmt_radio'
          cmt2300a_name: 'cmt2300a'
          cmt2300a_clk_pin: 'GPIO12'
          cmt2300a_sdio_pin: 'GPIO14'
          cmt2300a_cs_pin: 'GPIO027'
          cmt2300a_fcs_pin: 'GPIO26'
                
  hms1:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_hms-2t.yaml'
        vars:
          hms_id: 'hms1'
          hms_name: 'hms1'
          hms_cmt2300a_id: 'cmt_radio'
          hms_sn: !secret hms1000_sn1
          hms_poll_interval: '2s'
          
  nrf24l01:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_nrf24l01.yaml'
        vars:
          nrf24l01_id: 'nrf24l01_radio'
          nrf24l01_name: 'nrf24l01'
          nrf24l01_clk_pin: 'GPIO18'
          nrf24l01_mosi_pin: 'GPIO23'
          nrf24l01_miso_pin: 'GPIO19'
          nrf24l01_cs_pin: 'GPIO05'
          nrf24l01_ce_pin: 'GPIO04'
                    
  hm1:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_hm-1t.yaml'
        vars:
          hm_id: 'hm1'
          hm_name: 'hm1'
          hm_nrf24l01_id: 'nrf24l01_radio'
          hm_sn: !secret hm500_sn1
          hm_poll_interval: '2s'          

  hmsw1:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_hmsw-1t.yaml'
        vars:
          hmsw_id: 'hmsw1'
          hmsw_name: 'hmsw1'
          hmsw_ip_address: '192.168.1.50'
          hmsw_ip_port: 10081
          hmsw_poll_interval: '30s'
          hmsw_heartbeat_interval: '60s'
          hmsw_data_source: 'real_data_new'
          hmsw_alarm_poll_interval: '10min'
          hmsw_data_reboot_threshold: 10
          hmsw_stale_data_metric: 'ac_voltage'  