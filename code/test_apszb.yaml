substitutions:
  name: apsystems
  friendly_name: APsystems

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 802.15.4 channel 16 (2430 MHz) overlaps Wi-Fi channels 3..7: use a Wi-Fi channel such as 1 or 11 on your router

external_components:
  - source: github://SeByDocKy/myESPhome
    components: [apszb, apszb_inverter]

apszb:
  id: aps
  ecu_id: "D8A3011B9780"        # 12 hex digits, you choose it (PAN id = bytes 1,0 -> 0xA3D8)
  channel: 16
  poll_interval: 60s
  auto_pair: true               # the inverters must be awake (daylight) to be paired
  # log_frames: true            # dump every TX/RX frame in hex (debugging against a sniffer capture)
  # promiscuous: true           # receive frames of every PAN (sniffer mode, disables hardware address filtering)

apszb_inverter:
  - id: inv1
    apszb_id: aps
    serial: "408000158215"    # 12 digits printed on the inverter
    type: yc600               # yc600 | qs1 | ds3
    calibration: 0
  # - id: inv2
  #   apszb_id: aps
  #   serial: "703000021300"
  #   type: ds3

sensor:
  - platform: apszb_inverter
    apszb_inverter_id: inv1
    ac_voltage:
      name: ${name}_ac_voltage
    frequency:
      name: ${name}_frequency
    temperature:
      name: ${name}_temperature
    power_total:
      name: ${name}_power_total
    energy_total:
      name: ${name}_energy_total
    dc_voltage_1:
      name: ${name}_dc_voltage_1
    dc_voltage_2:
      name: ${name}_dc_voltage_2
    dc_current_1:
      name: ${name}_dc_current_1
    dc_current_2:
      name: ${name}_dc_current_2
    power_1:
      name: ${name}_power_1
    power_2:
      name: ${name}_power_2
    energy_1:
      name: ${name}_energy_1
    energy_2:
      name: ${name}_energy_2
    link_quality:
      name: ${name}_link_quality
    rssi:
      name: ${name}_rssi
    uptime:
      name: ${name}_uptime

text_sensor:
  - platform: apszb_inverter
    apszb_inverter_id: inv1
    status:
      name: ${name}_status
    serial:
      name: ${name}_serial
    short_address:
      name: ${name}_short_address

binary_sensor:
  - platform: apszb_inverter
    apszb_inverter_id: inv1
    online:
      name: ${name}_online

number:
  - platform: apszb_inverter
    apszb_inverter_id: inv1
    max_power:
      name: ${name}_max_power
      min_value: 30
      max_value: 600
      mode: slider

# float output (0..1 = 0..100 % of the rated power): lets a PID / template / light regulate the inverter, e.g.
#   zero-injection with `minipid` -> output: apszb_limit
output:
  - platform: apszb_inverter
    apszb_inverter_id: inv1
    power_limit_percent:
      id: apszb_limit

button:
  - platform: apszb_inverter
    apszb_inverter_id: inv1
    pair:
      name: ${name}_pair
    refresh:
      name: ${name}_refresh
    query_max_power:
      name: ${name}_query_max_power
    reboot_inverter:
      name: ${name}_reboot_inverter