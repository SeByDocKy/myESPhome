
substitutions:
  name: test_zeroinjection
  my_hours: '23'
  my_minute: '59'
  my_second: '59'
  reset_interval: '30s'

esphome:
  name: ${name}

esp32:
  board: esp32doit-devkit-v1
  cpu_frequency: 240Mhz
  toolchain: platformio
  framework:
    type: esp-idf
    version: 'dev'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  batch_delay: 50ms

ota:
  - platform: esphome
    
logger:
  # hardware_uart: USB_SERIAL_JTAG
   level: verbose    

debug:
  update_interval: 5s

time:
  - platform: sntp
    id: my_time
        
external_components:
  - source: "github://SeByDocKy/myESPhome/"
    components: [output_combined, sensor_combined]
    refresh: 10s 
            
sensor:

  - platform: wifi_signal
    name: ${name}_wifi_power
    id: wifi_power
    update_interval: 5s
    
  - platform: uptime
    id: uptime_sec
     
  - platform: debug
    free:
      name: ${name}_heap_free
    loop_time:
      name: ${name}_loop_time
      
      
  - platform: sensor_combined
    id: total_power
    name: ${name}_total_power
    unit_of_measurement: 'W'
    icon: mdi:power
    device_class: 'power'
    state_class: 'measurement'
    operation: 'sum'   # sum / mean / prod
    sensors:
      - hms1_inverter_power
      - hm1_inverter_power
      
text_sensor:
   
  - platform: template
    name: ${name}_uptime
    lambda: |-
      int seconds = (id(uptime_sec).state);
      int days = seconds / (24 * 3600);
      seconds = seconds % (24 * 3600); 
      int hours = seconds / 3600;
      seconds = seconds % 3600;
      int minutes = seconds /  60;
      seconds = seconds % 60;
      if ( days ) {
        return { (std::to_string(days) +"d " + std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( hours ) {
        return { (std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( minutes ) {
        return { (std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else {
        return { (std::to_string(seconds) +"s ").c_str() };
      }  
    icon: mdi:clock-start
    update_interval: 113s      


packages:

  cmt2300a:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_cmt2300a.yaml'
        vars:
          cmt2300a_id: 'cmt_radio'
          cmt2300a_name: 'cmt2300a'
          cmt2300a_clk_pin: 'GPIO12'
          cmt2300a_sdio_pin: 'GPIO14'
          cmt2300a_cs_pin: 'GPIO027'
          cmt2300a_fcs_pin: 'GPIO26'
          
          
  hms1:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_hms-2t.yaml'
        vars:
          hms_id: 'hms1'
          hms_name: 'hms1'
          hms_cmt2300a_id: 'cmt_radio'
          hms_sn: !secret hms1000_sn1
          hms_poll_interval: '2s'
          
          
  # hms2:
    # url: https://github.com/SeByDocKy/myESPhome/
    # ref: main
    # refresh: 0s
    # files:
      # - path: 'code/device_hms-2t.yaml'
        # vars:
          # hms_id: 'hms2'
          # hms_name: 'hms2'
          # hms_cmt2300a_id: 'cmt_radio'
          # hms_sn: !secret hms1000_sn2
          # hms_poll_interval: '2s'        
          
          
          
          
  nrf24l01:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_nrf24l01.yaml'
        vars:
          nrf24l01_id: 'nrf24l01_radio'
          nrf24l01_name: 'nrf24l01'
          nrf24l01_clk_pin: 'GPIO18'
          nrf24l01_mosi_pin: 'GPIO23'
          nrf24l01_miso_pin: 'GPIO19'
          nrf24l01_cs_pin: 'GPIO05'
          nrf24l01_ce_pin: 'GPIO04'
                    
  hm1:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_hm-1t.yaml'
        vars:
          hm_id: 'hm1'
          hm_name: 'hm1'
          hm_nrf24l01_id: 'nrf24l01_radio'
          hm_sn: !secret hm500_sn1
          hm_poll_interval: '2s'        
  

  shellypro3em:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_shellypro3em.yaml'
        vars:
          shelly_name: 'shelly'
          shelly_active_power_id: 'active_power'
          shelly_ip_address: '192.168.1.45'
          shelly_ip_port: '502'
          shelly_modbus_address: '1'
          shelly_update_interval: '1500ms'
          shelly_send_wait_time: '200ms'
          
          
  minipid:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_minipid.yaml'
        vars:
          minipid_id: 'pid'
          minipid_name: 'pid'
          minipid_input_id: 'active_power'
          minipid_output_id: 'my_output_combined'
          minipid_windows_size: 1
              
             
output:
  - platform: output_combined
    id: my_output_combined
    outputs:
      - hms1_power_limit_percent_output
      - hm1_power_limit_percent_output
      
fan:
  - platform: speed
    id: output_combined_command
    name: ${name}_output_combined_command
    output: my_output_combined     
              
button:
  - platform: template
    name: ${name}_hms_reset
    id: hms_reset
    on_press:
      - button.press: hms1_reset
      - button.press: hm1_reset

interval:
  - interval: ${reset_interval}
    then:
      - if:
          condition:
            binary_sensor.is_off: hms1_reachable
          then:
            - button.press: hms1_reset
      - if:
          condition:
            binary_sensor.is_off: hm1_reachable
          then:
            - button.press: hm1_reset


i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  id: i2c_display
  
  
font:
  - file: "gfonts://Roboto"
    id: font_display
    size: 11

display:
  - platform: ssd1306_i2c
    i2c_id: i2c_display
    model: "SSD1306 128x64"      # boîtiers OpenDTU 128x32 : "SSD1306 128x32"
    address: 0x3C
    update_interval: 1s
    lambda: |-
      it.printf(0, 0,  id(font_display), "Total : %.0f W", id(total_power).state);
      it.printf(0, 16, id(font_display), "Reg.  : %.0f W", id(active_power).state);
      it.printf(0, 32, id(font_display), "PID   : %.1f %%", id(pid_output).state);
      it.printf(0, 48, id(font_display), "Shelly: %s", id(current_shelly_ip_address).state.c_str());
 
  
  
            