substitutions:
  name: faikin
  friendly_name: Faikin
  tx_pin: GPIO17
  rx_pin: GPIO16

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: "github://SeByDocKy/myESPhome/"
    components: [faikin]
    refresh: 10s

# The Daikin S21 port is 2400 baud, 8 data bits, even parity, 2 stop bits.
# Set `inverted: true` on a pin if your interface board inverts that line.
uart:
  id: s21_uart
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 2400
  data_bits: 8
  parity: EVEN
  stop_bits: 2

faikin:
  id: ac
  uart_id: s21_uart
  update_interval: 1s
  response_timeout: 500ms
  command_gap: 25ms
  probe: true

climate:
  - platform: faikin
    faikin_id: ac
    name: ${name}_climate

sensor:
  - platform: faikin
    faikin_id: ac
    home_temperature:
      name: ${name}_home_temperature
    outside_temperature:
      name: ${name}_outside_temperature
    liquid_temperature:
      name: ${name}_liquid_temperature
    fan_speed:
      name: ${name}_fan_speed
    compressor:
      name: ${name}_compressor

binary_sensor:
  - platform: faikin
    faikin_id: ac
    connected:
      name: ${name}_connected

text_sensor:
  - platform: faikin
    faikin_id: ac
    protocol_version:
      name: ${name}_protocol_version
    model_code:
      name: ${name}_model_code

switch:
  - platform: faikin
    faikin_id: ac
    econo:
      name: ${name}_econo
    powerful:
      name: ${name}_powerful
    comfort:
      name: ${name}_comfort
    quiet:
      name: ${name}_quiet
    streamer:
      name: ${name}_streamer
    sensor:
      name: ${name}_sensor

# Demand control ("power on demand"). 100 % means no limit. The step the unit really accepts is
# not documented: start with 5 and check what the unit reads back.
number:
  - platform: faikin
    faikin_id: ac
    demand:
      name: ${name}_demand
      min_value: 40
      max_value: 100
      step: 5

# Float output for the demand control: 0.0 = 40 % power, 1.0 = 100 % power (rounded to the step).
# Use it as the output of a `pid` / `slow_pwm` style controller, or any float source.
output:
  - platform: faikin
    faikin_id: ac
    id: ${name}_demand_output
    min_demand: 40
    max_demand: 100
    step: 5

# Debug helpers: read the identification / capability commands again, or send a raw query.
# Answers are written to the log at INFO level.
button:
  - platform: template
    name: ${name}_probe
    entity_category: diagnostic
    on_press:
      - faikin.probe:
          id: ac
  - platform: template
    name: ${name}_read_demand
    entity_category: diagnostic
    on_press:
      - faikin.send_raw:
          id: ac
          command: "F7"
