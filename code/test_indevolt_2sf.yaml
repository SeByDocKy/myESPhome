substitutions:
  name: "test_indevolt_2sf"
  my_hours: '23'
  my_minute: '59'
  my_second: '59'

esphome:
  name: ${name}
  min_version: 2026.7.0

esp32:
  board: esp32dev
  cpu_frequency: 240Mhz
  framework:
    type: esp-idf
    version: 'dev'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  batch_delay: 50ms

ota:
  - platform: esphome

logger:
  level: DEBUG

debug:
  update_interval: 5s

time:
  - platform: sntp
    id: my_time

packages:

  sf1:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_indevolt.yaml'
        vars:
          indevolt_name: 'sf1'
          indevolt_id: 'sf1'
          indevolt_ip_address: '192.168.1.70'   # fixed IP of the battery (DHCP reservation)
          indevolt_ip_port: '8080'              # local HTTP "OpenData" API (enable it in the INDEVOLT app)
          indevolt_model: 'SF2000'              # SF2000 / PF2000 or BK1600 / BK1600_ULTRA
          indevolt_fast_poll_interval: '5s'     # power, SOC, state, work mode ...
          indevolt_normal_poll_interval: '20s'  # voltages, temperatures, energies, packs
          indevolt_slow_poll_interval: '60s'    # serial numbers, firmwares, settings

  sf2:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_indevolt.yaml'
        vars:
          indevolt_name: 'sf2'
          indevolt_id: 'sf2'
          indevolt_ip_address: '192.168.1.71'   # fixed IP of the battery (DHCP reservation)
          indevolt_ip_port: '8080'              # local HTTP "OpenData" API (enable it in the INDEVOLT app)
          indevolt_model: 'SF2000'              # SF2000 / PF2000 or BK1600 / BK1600_ULTRA
          indevolt_fast_poll_interval: '5s'     # power, SOC, state, work mode ...
          indevolt_normal_poll_interval: '20s'  # voltages, temperatures, energies, packs
          indevolt_slow_poll_interval: '60s'    # serial numbers, firmwares, settings

sensor:

  - platform: wifi_signal
    name: ${name}_wifi_power
    id: wifi_power
    update_interval: 5s

  - platform: uptime
    id: uptime_sec

  - platform: debug
    free:
      name: ${name}_heap_free
    loop_time:
      name: ${name}_loop_time

text_sensor:
  - platform: template
    name: ${name}_uptime
    lambda: |-
      int seconds = (id(uptime_sec).state);
      int days = seconds / (24 * 3600);
      seconds = seconds % (24 * 3600);
      int hours = seconds / 3600;
      seconds = seconds % 3600;
      int minutes = seconds /  60;
      seconds = seconds % 60;
      if ( days ) {
        return { (std::to_string(days) +"d " + std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( hours ) {
        return { (std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( minutes ) {
        return { (std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else {
        return { (std::to_string(seconds) +"s ").c_str() };
      }
    icon: mdi:clock-start
    update_interval: 113s
