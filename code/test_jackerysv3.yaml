substitutions:
  name: "test_jackerysv3"
  my_hours: '23'
  my_minute: '59'
  my_second: '59'

esphome:
  name: ${name}
  min_version: 2026.7.0

esp32:
  board: esp32dev
  cpu_frequency: 240Mhz
  framework:
    type: esp-idf
    version: 'dev'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  batch_delay: 50ms

ota:
  - platform: esphome

logger:
  level: DEBUG
  
debug:
  update_interval: 5s  

# Recommended: the poll requests carry a timestamp

# external_components:
  # - source: "github://SeByDocKy/myESPhome/"
    # components: [jackerysv3, mqtt_broker]
    # refresh: 1min
    
  
time:
  - platform: sntp
    id: my_time    
    
    
    
packages:

  sv3:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_jackerysv3.yaml'
        vars:
          jackerysv3_name: 'sv3'
          jackerysv3_id: 'sv3'
          jackerysv3_ip_address: '192.168.1.60'
          jackerysv3_sn: !secret sf3_sn1
          jackerysv3_token: !secret sf3_token1
          jackerysv3_poll_interval: '5s'    
          
          
          
sensor:

  - platform: wifi_signal
    name: ${name}_wifi_power
    id: wifi_power
    update_interval: 5s

  - platform: uptime
    id: uptime_sec

  - platform: debug
    free:
      name: ${name}_heap_free
    loop_time:
      name: ${name}_loop_time          

