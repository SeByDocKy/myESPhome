
external_components:
  - source: "github://SeByDocKy/myESPhome/"
    components: [zensdk]
    refresh: 10s 

globals:
  - id: ${zensdk_name}_energy_yesterday_global
    type: float
    restore_value: yes
    
time:
  - platform: sntp
    id: !extend my_time
    on_time:
      - seconds: ${my_second}
        minutes: ${my_minute}
        hours: ${my_hours}
        then:  
          - globals.set:
              id: ${zensdk_name}_energy_yesterday_global
              value: !lambda return ( id(${zensdk_name}_energy_yesterday_global) =  float( id(${zensdk_name}_energy_today).state) );
            
zensdk:
  - id: ${zensdk_id}
    ip_address: ${zensdk_ip_address}
    ip_port: ${zensdk_ip_port}
    sn: ${zensdk_sn}
    poll_interval: ${zensdk_poll_interval}
    model: ${zensdk_model}
    soc_scale: ${zensdk_soc_scale}
    write_flash_on_stop: ${zensdk_write_flash_on_stop}

sensor:
  - platform: zensdk
    zensdk_id: ${zensdk_id}
    solar_input_power:
      name: ${name}_${zensdk_name}_solar_input_power
    rssi:
      name: ${name}_${zensdk_name}_rssi
    enclosure_temperature:
      name: ${name}_${zensdk_name}_enclosure_temperature
    fault_level:
      name: ${name}_${zensdk_name}_fault_level

    # One entry per MPPT string, 0-indexed (pv0, pv1, ...).
    dc_channels:
      - pv0:
          power:
            name: ${name}_${zensdk_name}_pv0_power
      - pv1:
          power:
            name: ${name}_${zensdk_name}_pv1_power
      - pv2:
          power:
            name: ${name}_${zensdk_name}_pv2_power
      - pv3:
          power:
            name: ${name}_${zensdk_name}_pv3_power
      - pv4:
          power:
            name: ${name}_${zensdk_name}_pv4_power
      - pv5:
          power:
            name: ${name}_${zensdk_name}_pv5_power

    ac:
      home_power:
        name: ${name}_${zensdk_name}_output_home_power
        id: ${zensdk_name}_output_home_power
      grid_power:
        name: ${name}_${zensdk_name}_grid_input_power
      offgrid_power:
        name: ${name}_${zensdk_name}_grid_off_power
      status:
        name: ${name}_${zensdk_name}_ac_status

    battery:
      soc:
        name: ${name}_${zensdk_name}_electric_level
      voltage:
        name: ${name}_${zensdk_name}_battery_voltage
      charge_power:
        name: ${name}_${zensdk_name}_pack_input_power
      discharge_power:
        name: ${name}_${zensdk_name}_output_pack_power
      soc_limit:
        name: ${name}_${zensdk_name}_soc_limit
      charge_max_limit:
        name: ${name}_${zensdk_name}_charge_max_limit
      pack_count:
        name: ${name}_${zensdk_name}_pack_num
      remain_out_time:
        name: ${name}_${zensdk_name}_remain_out_time
      remain_input_time:
        name: ${name}_${zensdk_name}_remain_input_time
      status:
        name: ${name}_${zensdk_name}_dc_status
      # One entry per battery pack, 0-indexed (pack0, pack1, ...), matched by
      # position in packData (pack_count reports how many the device sees).
      packs:
        - pack0:
            soc_level:
              name: ${name}_${zensdk_name}_pack0_soc_level
            power:
              name: ${name}_${zensdk_name}_pack0_power
            temperature:
              name: ${name}_${zensdk_name}_pack0_temperature
            total_voltage:
              name: ${name}_${zensdk_name}_pack0_total_voltage
            current:
              name: ${name}_${zensdk_name}_pack0_current
            max_cell_voltage:
              name: ${name}_${zensdk_name}_pack0_max_cell_voltage
            min_cell_voltage:
              name: ${name}_${zensdk_name}_pack0_min_cell_voltage
            delta_cell_voltage:
              name: ${name}_${zensdk_name}_pack0_delta_cell_voltage
        - pack1:
            soc_level:
              name: ${name}_${zensdk_name}_pack1_soc_level
            power:
              name: ${name}_${zensdk_name}_pack1_power
            temperature:
              name: ${name}_${zensdk_name}_pack1_temperature
            total_voltage:
              name: ${name}_${zensdk_name}_pack1_total_voltage
            current:
              name: ${name}_${zensdk_name}_pack1_current
            max_cell_voltage:
              name: ${name}_${zensdk_name}_pack1_max_cell_voltage
            min_cell_voltage:
              name: ${name}_${zensdk_name}_pack1_min_cell_voltage
            delta_cell_voltage:
              name: ${name}_${zensdk_name}_pack1_delta_cell_voltage
        - pack2:
            soc_level:
              name: ${name}_${zensdk_name}_pack2_soc_level
            power:
              name: ${name}_${zensdk_name}_pack2_power
            temperature:
              name: ${name}_${zensdk_name}_pack2_temperature
            total_voltage:
              name: ${name}_${zensdk_name}_pack2_total_voltage
            current:
              name: ${name}_${zensdk_name}_pack2_current
            max_cell_voltage:
              name: ${name}_${zensdk_name}_pack2_max_cell_voltage
            min_cell_voltage:
              name: ${name}_${zensdk_name}_pack2_min_cell_voltage
            delta_cell_voltage:
              name: ${name}_${zensdk_name}_pack2_delta_cell_voltage


  - platform: total_daily_energy
    name: ${name}_${zensdk_name}_energy_today
    id: ${zensdk_name}_energy_today
    power_id: ${zensdk_name}_output_home_power
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    method: right
    restore: true
    filters:
        # Multiplication factor from W to kW is 0.001
      - multiply: 0.001
    icon: mdi:counter
    
  - platform: template
    name: ${name}_${zensdk_name}_energy_yesterday
    id: ${zensdk_name}_energy_yesterday
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    icon: mdi:counter
    # update_interval: ${hms_inverter_template_update}
    lambda: |-
      return (id(${zensdk_name}_energy_yesterday).state = id(${zensdk_name}_energy_yesterday_global));


binary_sensor:
  - platform: zensdk
    zensdk_id: ${zensdk_id}
    online:
      name: ${name}_${zensdk_name}_online
    heat_state:
      name: ${name}_${zensdk_name}_heat_state
    bypass:
      name: ${name}_${zensdk_name}_bypass
    reverse_state:
      name: ${name}_${zensdk_name}_reverse_state
    grid_connected:
      name: ${name}_${zensdk_name}_grid_connected
    pv_active:
      name: ${name}_${zensdk_name}_pv_active
    soc_calibrating:
      name: ${name}_${zensdk_name}_soc_calibrating
    error:
      name: ${name}_${zensdk_name}_error
    fan:
      name: ${name}_${zensdk_name}_fan
    lamp:
      name: ${name}_${zensdk_name}_lamp
    data_ready:
      name: ${name}_${zensdk_name}_data_ready

text_sensor:
  - platform: zensdk
    zensdk_id: ${zensdk_id}
    state:
      name: ${name_${zensdk_name}}_state
    firmware_version:           # masterSoftVersion, else masterFirmwareVersion (decoded as vX.Y.ZZ)
      name: ${name}_${zensdk_name}_firmware_version
    ac_firmware_version:
      name: ${name}_${zensdk_name}_ac_firmware_version
    dc_firmware_version:
      name: ${name}_${zensdk_name}_dc_firmware_version
    bms_firmware_version:
      name: ${name}_${zensdk_name}_bms_firmware_version
    mppt_firmware_version:
      name: ${name}_${zensdk_name}_mppt_firmware_version
    battery:
      # One entry per battery pack, 0-indexed (pack0, pack1, ...), same order as
      # the sensor platform's battery.packs.
      packs:
        - pack0:
            state:
              name: ${name}_${zensdk_name}_pack0_state
            sn:
              name: ${name}_${zensdk_name}_pack0_sn
            firmware_version:
              name: ${name}_${zensdk_name}_pack0_firmware_version
        - pack1:
            state:
              name: ${name}_${zensdk_name}_pack1_state
            sn:
              name: ${name}_${zensdk_name}_pack1_sn
            firmware_version:
              name: ${name}_${zensdk_name}_pack1_firmware_version
        - pack2:
            state:
              name: ${name}_${zensdk_name}_pack2_state
            sn:
              name: ${name}_pack2_sn
            firmware_version:
              name: ${name}_${zensdk_name}_pack2_firmware_version

number:
  - platform: zensdk
    zensdk_id: ${zensdk_id}
    power_setpoint:             # signed W: > 0 discharge, < 0 charge, 0 stop
      name: ${name}_${zensdk_name}_power_setpoint
    input_limit:                # AC charge power (W), full smart-mode charge command
      name: ${name}_${zensdk_name}_input_limit
    output_limit:               # AC output power (W), full smart-mode discharge command
      name: ${name}_${zensdk_name}_output_limit
    soc_set:
      name: ${name}_${zensdk_name}_soc_set
    min_soc:
      name: ${name}_${zensdk_name}_min_soc
    inverse_max_power:
      name: ${name}_${zensdk_name}_inverse_max_power

switch:
  - platform: zensdk
    zensdk_id: ${zensdk_id}
    lamp:                       # LED strip (write taken from Zendure-HA, unverified on SolarFlow)
      name: ${name}_${zensdk_name}_lamp
    kickstart:                  # software-only: +/-50 W request bumped to limit + 4 W when the device does not follow
      name: ${name}_${zensdk_name}_kickstart

select:
  - platform: zensdk
    zensdk_id: ${zensdk_id}
    ac_mode:
      name: ${name}_${zensdk_name}_ac_mode
    grid_off_mode:
      name: ${name}_${zensdk_name}_grid_off_mode

output:
  - platform: zensdk
    zensdk_id: ${zensdk_id}
    charge_power:               # 0.0 .. 1.0 -> 0 .. max charge power
      id: ${name}_${zensdk_name}_charge_power_output
    discharge_power:            # 0.0 .. 1.0 -> 0 .. max discharge power
      id: ${name}_${zensdk_name}_discharge_power_output