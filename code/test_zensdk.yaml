substitutions:
  name: 'test_zensdk'
  my_hours: '23'
  my_minute: '59'
  my_second: '59'

esphome:
  name: ${name}
  min_version: 2026.9.0

esp32:
  #board: esp32-s3-devkitc-1
  board: esp32dev
  cpu_frequency: 240Mhz
  # toolchain: platformio
  framework:
    type: esp-idf
    version: 'dev'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  batch_delay: 50ms

ota:
  - platform: esphome


