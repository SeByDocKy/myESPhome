packages:

  sf2400:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_zensdk.yaml'
        vars:
          zensdk_id: 'mx1000'
          zensdk_name: 'mx1000'
          zensdk_ip_address: '192.168.1.60'
          zensdk_ip_port: 80
          zensdk_model: 'SF2400_AC_PLUS'
          zensdk_sn: !secret sf2400_sn1
          zensdk_soc_scale: 10
          zensdk_write_flash_on_stop: false
          zensdk_poll_interval: '5s'
sensor:

  - platform: wifi_signal
    name: ${name}_wifi_power
    id: wifi_power
    update_interval: 5s

  - platform: uptime
    id: uptime_sec

  - platform: debug
    free:
      name: ${name}_heap_free
    loop_time:
      name: ${name}_loop_time

