substitutions:
  name: "test_ch9438"

esphome:
  name: ${name}
  min_version: 2026.7.0

esp32:
  board: esp32dev
  cpu_frequency: 240Mhz
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  batch_delay: 50ms

ota:
  - platform: esphome

external_components:

  - source: "github://SeByDocKy/myESPhome/"
    components: [ch9438]
    refresh: 10s

  # - source:
      # type: local
      # path: components

logger:
  level: debug            # very_verbose : trace de tous les acces SPI

debug:
  update_interval: 5s

# ---------------------------------------------------------------------------
# Bus SPI : le CH9438 travaille en mode 0 (CPOL=0, CPHA=0), gere par le composant
# ---------------------------------------------------------------------------
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

# ---------------------------------------------------------------------------
# Rappel des pins partagees (une seule fonction par pin physique) :
#   GPIO0 : CTS1 / TNOW0          GPIO4 : RTS3 / TNOW4
#   GPIO1 : RTS1 / TNOW1 / INT#   GPIO5 : CTS3 / TNOW5
#   GPIO2 : RTS2 / TNOW2          GPIO6 : RTS4 / TNOW6
#   GPIO3 : CTS2 / TNOW3          GPIO7 : CTS4 / TNOW7 / XO (quartz)
#
# Dans cet exemple :
#   irq_pin          -> GPIO1 du chip
#   UART1 CTS        -> GPIO0 du chip
#   UART2 RS485      -> TNOW2 = GPIO2 du chip
#   UART4 RTS/CTS    -> GPIO6 et GPIO7 du chip
#   libres (GPIO)    -> GPIO3, GPIO4, GPIO5 du chip
# ---------------------------------------------------------------------------
ch9438:
  id: ch9438_hub
  cs_pin: GPIO17
  irq_pin:                    # optionnel : sans lui, le chip est lu a chaque loop()
    number: GPIO4
    mode: INPUT_PULLUP
  data_rate: 10MHz            # defaut 4MHz, 25MHz max (SPI mode 0 par defaut)
  # reset_pin: GPIO16         # optionnel : sortie reliee a RST# du CH9438 (reset au demarrage)
  # crystal: 16MHz           # quartz sur XI/XO (utilise la pin GPIO7 : incompatible avec flow_control sur UART4)
                            # 11.0592MHz permet le 2400 bauds, mais seul 16MHz est documente (voir README)
  test_mode: 2                # 0: normal | 1: boucle courte | 2: boucle 1024 octets + debit + stats CPU/SPI toutes les 10s
  uart:
    - id: ch_uart_0           # test en boucle : relier TX0 a RX0
      channel: 0
      baud_rate: 115200
      rx_buffer_size: 512
      restore_baud_rate: true   # keep the speed set by ch9438.change_baud_rate over a reboot

    - id: ch_uart_1
      channel: 1
      baud_rate: 9600
      flow_control: cts       # UART1 : CTS seulement (RTS1 partage la pin INT#)

    - id: ch_uart_2           # liaison RS485 (transceiver externe, TNOW2 -> DE/RE)
      channel: 2
      baud_rate: 9600
      rs485:
        invert: false

    - id: ch_uart_3           # 7 data bits emulated in software (7E1: the 8th bit carries the parity)
      channel: 3
      baud_rate: 9600
      data_bits: 7
      parity: even

    - id: ch_uart_4
      channel: 4
      baud_rate: 19200
      flow_control: rts_cts

# Exemple Modbus RTU sur la liaison RS485 :
# modbus:
#   - id: modbus_bus
#     uart_id: ch_uart_2

# Avec test_mode 1 ou 2, le composant fait lui-meme le test en boucle (TX relie a RX sur chaque UART configure)
# et affiche le resultat dans les logs. Pour un usage normal, remettre test_mode: 0.

sensor:

  - platform: wifi_signal
    name: ${name}_wifi_power
    id: wifi_power
    update_interval: 5s

  - platform: uptime
    id: uptime_sec

  - platform: debug
    free:
      name: ${name}_heap_free
    loop_time:
      name: ${name}_loop_time

text_sensor:
  - platform: ch9438
    ch9438_id: ch9438_hub
    version:
      name: ${name}_chip_version

# GPIO du chip (utilises comme des pins ESPHome classiques)
binary_sensor:
  - platform: gpio
    name: ${name}_input_gpio3
    pin:
      ch9438: ch9438_hub
      number: 3
      mode:
        input: true
        pullup: true
      inverted: true

# Action ch9438.change_baud_rate : changement de vitesse de l'UART0 a chaud
button:
  - platform: template
    name: ${name}_uart0_baud_9600
    on_press:
      - ch9438.change_baud_rate:
          id: ch_uart_0
          baud_rate: 9600

  - platform: template
    name: ${name}_uart0_baud_115200
    on_press:
      - ch9438.change_baud_rate:
          id: ch_uart_0
          baud_rate: 115200

  - platform: template
    name: ${name}_uart0_baud_921600
    on_press:
      - ch9438.change_baud_rate:
          id: ch_uart_0
          baud_rate: !lambda 'return 921600;'

switch:
  - platform: gpio
    name: ${name}_relay_gpio4
    pin:
      ch9438: ch9438_hub
      number: 4
      mode:
        output: true

  - platform: gpio
    name: ${name}_relay_gpio5
    pin:
      ch9438: ch9438_hub
      number: 5
      mode:
        output: true
        open_drain: true
