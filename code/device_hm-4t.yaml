
external_components:
  - source: "github://SeByDocKy/myESPhome/"
    components: [hm]
    refresh: 10s 


globals:
  - id: ${hm_name}_energy_yesterday_global
    type: float
    restore_value: yes
    
time:
  - platform: sntp
    id: !extend my_time
    on_time:
      - seconds: ${my_second}
        minutes: ${my_minute}
        hours: ${my_hours}
        then:  
          - globals.set:
              id: ${hm_name}_energy_yesterday_global
              value: !lambda return ( id(${hm_name}_energy_yesterday_global) =  float( id(${hm_name}_energy_today).state) );
            
hm:
  - id: ${hm_id}
    nrf24l01_id: ${hm_nrf24l01_id}
    sn: ${hm_sn}
    poll_interval: ${hm_poll_interval}

sensor:
  
  - platform: nrf24l01
    nrf24l01_id: ${hm_nrf24l01_id}
    duty_cycle:
      name: ${name}_${hm_name}_duty_cycle
      update_interval: 15s  

  - platform: nrf24l01
    nrf24l01_id: ${hm_nrf24l01_id}
    hm_count:
      name: ${name}_${hm_name}_reachable_hm

  - platform: hm
    hm_id: ${hm_id}
    dc_channels:
      - pv0:
          power: 
            name: ${name}_${hm_name}_pv0_power
          current: 
            name: ${name}_${hm_name}_pv0_current
          voltage: 
            name: ${name}_${hm_name}_pv0_voltage
          energy_today: 
            name: ${name}_${hm_name}_pv0_energy_today
          energy_total: 
            name: ${name}_${hm_name}_pv0_energy_total
      - pv1:
          power: 
            name: ${name}_${hm_name}_pv1_power
          current: 
            name: ${name}_${hm_name}_pv1_current
          voltage: 
            name: ${name}_${hm_name}_pv1_voltage
          energy_today: 
            name: ${name}_${hm_name}_pv1_energy_today
          energy_total: 
            name: ${name}_${hm_name}_pv1_energy_total
            
      - pv2:
          power: 
            name: ${name}_${hm_name}_pv2_power
          current: 
            name: ${name}_${hm_name}_pv2_current
          voltage: 
            name: ${name}_${hm_name}_pv2_voltage
          energy_today: 
            name: ${name}_${hm_name}_pv2_energy_today
          energy_total: 
            name: ${name}_${hm_name}_pv2_energy_total
      - pv3:
          power: 
            name: ${name}_${hm_name}_pv3_power
          current: 
            name: ${name}_${hm_name}_pv3_current
          voltage: 
            name: ${name}_${hm_name}_pv3_voltage
          energy_today: 
            name: ${name}_${hm_name}_pv3_energy_today
          energy_total: 
            name: ${name}_${hm_name}_pv3_energy_total      
    ac:
      voltage: 
        name: ${name}_${hm_name}_ac_voltage
      current: 
        name: ${name}_${hm_name}_ac_current
      power: 
        name: ${name}_${hm_name}_ac_power
      frequency: 
        name: ${name}_${hm_name}_ac_frequency
      power_factor: 
        name: ${name}_${hm_name}_ac_power_factor
      reactive_power: 
        name: ${name}_${hm_name}_ac_reactive_power
    inverter:
      temperature: 
        name: ${name}_${hm_name}_inverter_temperature
      power: 
        name: ${name}_${hm_name}_inverter_power
        id: ${hm_name}_inverter_power
      energy_today: 
        name: ${name}_${hm_name}_inverter_energy_today
      energy_total: 
        name: ${name}_${hm_name}_inverter_energy_total
      efficiency: 
        name: ${name}_${hm_name}_inverter_efficiency
    # rssi: 
    #   name: ${name}_${hm_name}_rssi

  - platform: total_daily_energy
    name: ${name}_${hm_name}_energy_today
    id: ${hm_name}_energy_today
    power_id: ${hm_name}_inverter_power
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    method: right
    restore: true
    filters:
        # Multiplication factor from W to kW is 0.001
      - multiply: 0.001
    icon: mdi:counter
    
  - platform: template
    name: ${name}_${hm_name}_energy_yesterday
    id: ${hm_name}_energy_yesterday
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    icon: mdi:counter
    # update_interval: ${hm_inverter_template_update}
    lambda: |-
      return (id(${hm_name}_energy_yesterday).state = id(${hm_name}_energy_yesterday_global));
         
binary_sensor:

  - platform: hm
    hm_id: ${hm_id}
    reachable:
      name: ${name}_${hm_name}_reachable
      id: ${hm_name}_reachable
    producing:
      name: ${name}_${hm_name}_producing
      id: ${hm_name}_producing      
      
number:
  - platform: hm
    hm_id: ${hm_id}
    power_percent: 
      name: ${name}_${hm_name}_power_limit_percent
    power_absolute: 
      name: ${name}_${hm_name}_power_limit_w
      
      
output:
  - platform: hm
    hm_id: ${hm_id}
    power_limit_percent:
      id: ${hm_name}_power_limit_percent_output

fan:
  - platform: speed
    id: ${hm_name}_output_command
    name: ${name}_${hm_name}_output_command
    output: ${hm_name}_power_limit_percent_output     
    
button:
  - platform: hm
    hm_id: ${hm_id}
    reset_to_output_min:
      name: ${name}_${hm_name}_reset_to_output_min
    reset_to_output_max:
      name: ${name}_${hm_name}_reset_to_output_max
    reset_hm:
      name: ${name}_${hm_name}_reset_hm
      id: ${hm_name}_reset      