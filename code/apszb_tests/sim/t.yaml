esphome:
  name: hosttest
host:
logger:
  level: VERBOSE
external_components:
  - source:
      type: local
      path: ext
    components: [apszb, apszb_inverter]
apszb:
  id: aps
  ecu_id: "D8A3011B9780"
  poll_interval: 5s
  offline_after: 2

apszb_inverter:
  - id: inv1
    serial: "408000158215"
    type: yc600
    short_address: 0x103A
  - id: inv2
    serial: "703000021300"
    type: ds3

sensor:
  - platform: apszb_inverter
    inverter: inv1
    ac_voltage:
      name: v1_ac_voltage
    frequency:
      name: v1_frequency
    temperature:
      name: v1_temperature
    power_total:
      name: v1_power_total
    energy_total:
      name: v1_energy_total
    dc_voltage_1:
      name: v1_dcv1
    power_1:
      name: v1_p1
    power_2:
      name: v1_p2
    energy_1:
      name: v1_e1
    link_quality:
      name: v1_lq
  - platform: apszb_inverter
    inverter: inv2
    ac_voltage:
      name: v2_ac_voltage
    power_total:
      name: v2_power_total
text_sensor:
  - platform: apszb_inverter
    inverter: inv1
    status:
      name: v1_status
binary_sensor:
  - platform: apszb_inverter
    inverter: inv1
    online:
      name: v1_online
number:
  - platform: apszb_inverter
    inverter: inv1
    max_power:
      name: v1_max_power
output:
  - platform: apszb_inverter
    inverter: inv1
    power_limit_percent:
      id: apszb_limit

button:
  - platform: apszb_inverter
    inverter: inv1
    pair:
      name: v1_pair
