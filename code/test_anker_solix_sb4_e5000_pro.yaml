# Anker SOLIX Solarbank 4 E5000 Pro (Modbus RTU / RS485).
# Register map "sb4_e5000_pro" of the official Anker integration (same registers as the Solarbank Max AC; only the Max
# AC is reported as validated on hardware). The serial number codes DN7M / DPM4 are recognised by `product_name`.
# Start read-only (auto_third_party_control: false) and compare the readings with the Anker app before any write.
# Enable "Modbus RTU" in the Anker app (Three-Party Control Settings); baud rate, parity and slave address as shown
# there. The RTU register map is assumed identical to the TCP one: not validated.

substitutions:
  name: test_sb4
  my_hours: '23'
  my_minute: '59'
  my_second: '59'

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
 

debug:
  update_interval: 5s

time:
  - platform: sntp
    id: my_time
 
uart:
  id: uart_0
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  stop_bits: 1
  parity: NONE 
  
packages:

  modbus_0:
    url: https://github.com/SeByDocKy/pvbrain2/
    ref: main
    refresh: 0s
    files: 
      - path: 'pvbrain2/base/device_modbus.yaml'
        vars:
          modbus_id: 'modbus_0'
          modbus_uart_id: uart_0
          modbus_send_wait_time: '100ms'
          modbus_turnaround_time: '100ms'
  
  sb4:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_anker_solix.yaml'
        vars:
          anker_solix_name: 'sb4'
          anker_solix_id: 'sb4'
          anker_solix_model: 'sb4_e5000_pro'
          anker_solix_modbus_controller: 'modbus_0'
          anker_solix_modbus_address: '1'
          # anker_solix_turnaround_time: '100ms'
          # anker_solix_tx_pin: GPIO17
          # anker_solix_rx_pin: GPIO16
          # anker_solix_baud_rate: 9600
          anker_solix_fast_update_interval: '5s'
          anker_solix_slow_update_interval: '60s'

sensor:
  - platform: wifi_signal
    name: ${name}_wifi_power
    id: wifi_power
    update_interval: 5s

  - platform: uptime
    id: uptime_sec

  - platform: debug
    free:
      name: ${name}_heap_free
    loop_time:
      name: ${name}_loop_time


text_sensor:
  - platform: template
    name: ${name}_uptime
    lambda: |-
      int seconds = (id(uptime_sec).state);
      int days = seconds / (24 * 3600);
      seconds = seconds % (24 * 3600); 
      int hours = seconds / 3600;
      seconds = seconds % 3600;
      int minutes = seconds /  60;
      seconds = seconds % 60;
      if ( days ) {
        return { (std::to_string(days) +"d " + std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( hours ) {
        return { (std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( minutes ) {
        return { (std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else {
        return { (std::to_string(seconds) +"s ").c_str() };
      }  
    icon: mdi:clock-start
    update_interval: 113s



