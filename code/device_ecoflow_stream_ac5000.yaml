# EcoFlow STREAM AC 5000: every entity of the `stream_ac5000` register map (GENERATED by
# components/ecoflow_stream/tools/gen_yaml.py).
# Package vars: ecoflow_name, ecoflow_id, ecoflow_modbus_controller (id of the modbus bus),
# ecoflow_modbus_address, ecoflow_fast_update_interval, ecoflow_slow_update_interval.
#
# READ ONLY as shipped. The controls are in the commented block at the end: uncomment them once the readings
# have been checked against the EcoFlow app (it needs "View and control" there).

external_components:
  - source: github://SeByDocKy/myESPhome
    components: [ecoflow_stream]
    refresh: 10s

modbus_controller:
  - id: ${ecoflow_name}_fast_modbus_controller
    address: ${ecoflow_modbus_address}
    modbus_id: ${ecoflow_modbus_controller}
    update_interval: ${ecoflow_fast_update_interval}
  - id: ${ecoflow_name}_slow_modbus_controller
    address: ${ecoflow_modbus_address}
    modbus_id: ${ecoflow_modbus_controller}
    update_interval: ${ecoflow_slow_update_interval}

ecoflow_stream:
  id: ${ecoflow_id}
  model: stream_ac5000
  modbus_controller_id: ${ecoflow_name}_fast_modbus_controller
  slow_modbus_controller_id: ${ecoflow_name}_slow_modbus_controller

sensor:
  - platform: ecoflow_stream
    ecoflow_stream_id: ${ecoflow_id}
    ac:
      inverter_power:
        name: ${name}_${ecoflow_name}_ac_inverter_power
      home_power:
        name: ${name}_${ecoflow_name}_ac_home_power
      grid_power:
        name: ${name}_${ecoflow_name}_ac_grid_power
      max_output_power:
        name: ${name}_${ecoflow_name}_ac_max_output_power
      max_input_power:
        name: ${name}_${ecoflow_name}_ac_max_input_power
      frequency:
        name: ${name}_${ecoflow_name}_ac_frequency
      grid_import_energy:
        name: ${name}_${ecoflow_name}_ac_grid_import_energy
      grid_export_energy:
        name: ${name}_${ecoflow_name}_ac_grid_export_energy
      home_energy:
        name: ${name}_${ecoflow_name}_ac_home_energy
      phases:
        phase0:
          power:
            name: ${name}_${ecoflow_name}_ac_phases_phase0_power
        phase1:
          power:
            name: ${name}_${ecoflow_name}_ac_phases_phase1_power
        phase2:
          power:
            name: ${name}_${ecoflow_name}_ac_phases_phase2_power
      bypass_power:
        name: ${name}_${ecoflow_name}_ac_bypass_power
    utc_time:
      name: ${name}_${ecoflow_name}_utc_time
    time_zone:
      name: ${name}_${ecoflow_name}_time_zone
    dc_channels:
      power:
        name: ${name}_${ecoflow_name}_dc_channels_power
      energy:
        name: ${name}_${ecoflow_name}_dc_channels_energy
      pv0:
        power:
          name: ${name}_${ecoflow_name}_dc_channels_pv0_power
      pv1:
        power:
          name: ${name}_${ecoflow_name}_dc_channels_pv1_power
      pv2:
        power:
          name: ${name}_${ecoflow_name}_dc_channels_pv2_power
      pv3:
        power:
          name: ${name}_${ecoflow_name}_dc_channels_pv3_power
    battery:
      power:
        name: ${name}_${ecoflow_name}_battery_power
      soc:
        name: ${name}_${ecoflow_name}_battery_soc
      full_capacity:
        name: ${name}_${ecoflow_name}_battery_full_capacity
      pack_count:
        name: ${name}_${ecoflow_name}_battery_pack_count
      packs:
        pack0:
          soc:
            name: ${name}_${ecoflow_name}_battery_pack0_soc
          soh:
            name: ${name}_${ecoflow_name}_battery_pack0_soh
        pack1:
          soc:
            name: ${name}_${ecoflow_name}_battery_pack1_soc
          soh:
            name: ${name}_${ecoflow_name}_battery_pack1_soh
        pack2:
          soc:
            name: ${name}_${ecoflow_name}_battery_pack2_soc
          soh:
            name: ${name}_${ecoflow_name}_battery_pack2_soh
      charge_energy:
        name: ${name}_${ecoflow_name}_battery_charge_energy
      discharge_energy:
        name: ${name}_${ecoflow_name}_battery_discharge_energy
      charge_capability:
        name: ${name}_${ecoflow_name}_battery_charge_capability
      discharge_capability:
        name: ${name}_${ecoflow_name}_battery_discharge_capability
      min_cell_temperature:
        name: ${name}_${ecoflow_name}_battery_min_cell_temperature
      max_cell_temperature:
        name: ${name}_${ecoflow_name}_battery_max_cell_temperature
      max_cell_voltage:
        name: ${name}_${ecoflow_name}_battery_max_cell_voltage
      min_cell_voltage:
        name: ${name}_${ecoflow_name}_battery_min_cell_voltage
    system_fault_count:
      name: ${name}_${ecoflow_name}_system_fault_count
    system_device_count:
      name: ${name}_${ecoflow_name}_system_device_count
    system_online_device_count:
      name: ${name}_${ecoflow_name}_system_online_device_count
    device_fault_count:
      name: ${name}_${ecoflow_name}_device_fault_count

text_sensor:
  - platform: ecoflow_stream
    ecoflow_stream_id: ${ecoflow_id}
    system_phase_type:
      name: ${name}_${ecoflow_name}_system_phase_type
    serial_number:
      name: ${name}_${ecoflow_name}_serial_number
    firmware_version:
      name: ${name}_${ecoflow_name}_firmware_version
    manufacturer:
      name: ${name}_${ecoflow_name}_manufacturer
    system_group_id:
      name: ${name}_${ecoflow_name}_system_group_id
    battery:
      packs:
        pack0:
          serial:
            name: ${name}_${ecoflow_name}_battery_pack0_serial
        pack1:
          serial:
            name: ${name}_${ecoflow_name}_battery_pack1_serial
        pack2:
          serial:
            name: ${name}_${ecoflow_name}_battery_pack2_serial
    system_fault_codes:
      name: ${name}_${ecoflow_name}_system_fault_codes
    device_fault_codes:
      name: ${name}_${ecoflow_name}_device_fault_codes

binary_sensor:
  - platform: ecoflow_stream
    ecoflow_stream_id: ${ecoflow_id}
    system_master:
      name: ${name}_${ecoflow_name}_system_master
    on_grid:
      name: ${name}_${ecoflow_name}_on_grid
    modbus_connection:
      name: ${name}_${ecoflow_name}_modbus_connection

