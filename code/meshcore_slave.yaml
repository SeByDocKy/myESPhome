substitutions:
  name: "meshcore-slave-0"
  device_description: "Slave meshcore générique"
  slave_id: '0'
  slave_name: "Slave 0"
  relay0_pin: "GPIO01"
  relay1_pin: "GPIO04"
  i2c_sda_pin: "GPIO02"
  i2c_scl_pin: "GPIO03"
  telemetry_interval: "5min"

esphome:
  name: ${name}
  comment: ${device_description}
  min_version: 2026.5.0

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  cpu_frequency: 240Mhz
  toolchain: platformio
  framework:
    type: esp-idf
    version: 'dev'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

external_components:

  - source:
      type: local
      path: components
    components: [meshcore]
    
    
  # - source: "github://SeByDocKy/myESPhome/"
    # components: [meshcore]
    # refresh: 0s

time:
  - platform: sntp
    id: my_time

api:
  batch_delay: 50ms

ota:
  - platform: esphome

logger:
  level: debug

spi:
  - id: spi_bus0
    mosi_pin: GPIO09
    miso_pin: GPIO08
    clk_pin: GPIO07
    interface: spi3

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true

sx126x:
  id: lora_radio
  spi_id: spi_bus0
  dio1_pin: GPIO39
  busy_pin: GPIO40
  rst_pin: GPIO42
  cs_pin: GPIO41
  pa_power: 22
  bandwidth: 62_5kHz
  crc_enable: true
  frequency: 869618000
  modulation: LORA
  hw_version: sx1262
  rf_switch: true
  sync_value: [0x14, 0x24]
  preamble_size: 16
  spreading_factor: 8
  coding_rate: CR_4_8
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  data_rate: '10MHz'

meshcore:
  - id: id_mesh
    lora: lora_radio
    node_name: ${slave_name}
    hop_limit: 3
    channels:
      - name: !secret meshcore_channel_name
        psk: !secret meshcore_channel_psk

    on_packet:
      then:
        - lambda: |-
            // Un seul canal est configure ci-dessus, "channel" correspond
            // donc toujours a celui-la : pas besoin de le refiltrer ici.

            // Meme decoupage "SLAVE:<id>,KEY1:VAL1,..." que sur meshtastic,
            // applique sur "text" (deja debarrasse du prefixe "nom: ").
            std::vector<std::string> tokens;
            std::string rest = text;
            size_t pos;
            while ((pos = rest.find(',')) != std::string::npos) {
              tokens.push_back(rest.substr(0, pos));
              rest.erase(0, pos + 1);
            }
            tokens.push_back(rest);

            if (tokens.empty() || tokens[0].rfind("SLAVE:", 0) != 0) return;

            const int MY_SLAVE_ID = ${slave_id};
            int target = atoi(tokens[0].substr(6).c_str());
            if (target != MY_SLAVE_ID) return;

            for (size_t i = 1; i < tokens.size(); i++) {
              size_t sep = tokens[i].find(':');
              if (sep == std::string::npos) continue;
              std::string key = tokens[i].substr(0, sep);
              std::string val = tokens[i].substr(sep + 1);

              if (key == "RELAY0") {
                if (val == "ON") { id(relay0).turn_on(); id(send_ack).execute(std::string("RELAY0"), std::string("ON")); }
                else if (val == "OFF") { id(relay0).turn_off(); id(send_ack).execute(std::string("RELAY0"), std::string("OFF")); }
              } else if (key == "RELAY1") {
                if (val == "ON") { id(relay1).turn_on(); id(send_ack).execute(std::string("RELAY1"), std::string("ON")); }
                else if (val == "OFF") { id(relay1).turn_off(); id(send_ack).execute(std::string("RELAY1"), std::string("OFF")); }
              }
            }

switch:
  - platform: gpio
    id: relay0
    name: ${name}_relay0
    pin: ${relay0_pin}
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relay1
    name: ${name}_relay1
    pin: ${relay1_pin}
    restore_mode: ALWAYS_OFF

script:
  - id: send_ack
    parameters:
      relay_name: string
      relay_state: string
    then:
      - meshcore.send_group_text:
          id: id_mesh
          channel: !secret meshstastic_channel_name
          text: !lambda |-
            return "SLAVE:${slave_id},ACK:" + relay_name + ":" + relay_state;

sensor:
  - platform: bme280_i2c
    address: 0x76
    update_interval: 30s
    temperature:
      name: ${name}_temperature
      id: bme280_temperature
      oversampling: 16x
    pressure:
      name: ${name}_pressure
      id: bme280_pressure
    humidity:
      name: ${name}_humidity
      id: bme280_humidity

interval:
  - interval: ${telemetry_interval}
    then:
      - meshcore.send_group_text:
          id: id_mesh
          channel: !secret meshcore_channel_name
          text: !lambda |-
            char buf[64];
            snprintf(buf, sizeof(buf), "SLAVE:${slave_id},TEMP:%.1f,HUM:%.1f,PRESS:%.1f",
                     id(bme280_temperature).state, id(bme280_humidity).state, id(bme280_pressure).state);
            return std::string(buf);
