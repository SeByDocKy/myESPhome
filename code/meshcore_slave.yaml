substitutions:
  name: "meshcore-slave-0"
  device_description: "Slave meshcore générique"
  slave_id: '0'
  slave_name: "Slave 0"
  relay0_pin: "GPIO01"
  relay1_pin: "GPIO04"
  i2c_sda_pin: "GPIO02"
  i2c_scl_pin: "GPIO03"
  telemetry_interval: "1min"

esphome:
  name: ${name}
  comment: ${device_description}
  min_version: 2026.5.0

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  cpu_frequency: 240Mhz
  toolchain: platformio
  framework:
    type: esp-idf
    version: 'dev'

external_components:

  # - source:
      # type: local
      # path: components
    # components: [meshcore]
    
    
  - source: "github://SeByDocKy/myESPhome/"
    components: [meshcore]
    refresh: 0s

# time:
  # - platform: sntp
    # id: my_time

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

api:
  batch_delay: 50ms

ota:
  - platform: esphome

logger:
  level: debug

spi:
  - id: spi_bus0
    mosi_pin: GPIO09
    miso_pin: GPIO08
    clk_pin: GPIO07
    interface: spi3

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true

sx126x:
  id: lora_radio
  spi_id: spi_bus0
  dio1_pin: GPIO39
  busy_pin: GPIO40
  rst_pin: GPIO42
  cs_pin: GPIO41
  pa_power: 22
  bandwidth: 62_5kHz
  crc_enable: true
  frequency: 869618000
  modulation: LORA
  hw_version: sx1262
  rf_switch: true
  sync_value: [0x14, 0x24]
  preamble_size: 16
  spreading_factor: 8
  coding_rate: CR_4_8
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  data_rate: '10MHz'

meshcore:
  - id: id_mesh
    lora: lora_radio
    node_name: ${slave_name}
    hop_limit: 3
    channels:
      - name: !secret meshcore_channel_name
        psk: !secret meshcore_channel_psk
    # Plus de "on_packet:" : tout (telemetrie, commande des relais, etat des
    # relais) passe desormais par "packet_transport" ci-dessous. Ce bloc ne
    # sert plus qu'a definir le canal (PSK) que packet_transport utilise en
    # arriere-plan pour transporter ses paquets GRP_DATA.

# --- Telemetrie BME280 -> master, et commandes des relais <- master, le
# tout via packet_transport / GRP_DATA (invisible dans le chat MeshCore) ---
# "sensors:"/"binary_sensors:" = ce que CE slave diffuse (temperature,
# humidite, pression, etat reel des relais).
# "providers:" = les autres appareils dont ce slave veut recevoir des
# donnees : ici le master, qui diffuse l'etat VOULU des relais (voir
# binary_sensor "remote_cmd_relayX" plus bas, qui declenche directement le
# switch correspondant).
packet_transport:
  - platform: meshcore
    meshcore_id: id_mesh
    channel: !secret meshcore_channel_name
    update_interval: ${telemetry_interval}
    sensors:
      - bme280_temperature
      - bme280_humidity
      - bme280_pressure
    binary_sensors:
      - relay0_state
      - relay1_state
    providers:
      - name: meshcore-master   # doit correspondre a esphome.name du master

# --- Etat reel des relais, remonte au master via packet_transport ---
# Publie a chaque changement (commande mesh OU tout autre declencheur futur),
# pas seulement apres une commande recue : source unique de verite.
binary_sensor:
  # Commande recue du master : "vrai" = allume ce relais. On agit directement
  # dessus, plus besoin d'aucun parsing de texte ni de on_packet.
  - platform: packet_transport
    provider: meshcore-master
    remote_id: cmd_slave${slave_id}_relay0
    id: remote_cmd_relay0
    internal: true
    on_state:
      then:
        - lambda: |-
            if (x) id(relay0).turn_on(); else id(relay0).turn_off();

  - platform: packet_transport
    provider: meshcore-master
    remote_id: cmd_slave${slave_id}_relay1
    id: remote_cmd_relay1
    internal: true
    on_state:
      then:
        - lambda: |-
            if (x) id(relay1).turn_on(); else id(relay1).turn_off();

  - platform: template
    id: relay0_state
    internal: true
  - platform: template
    id: relay1_state
    internal: true

switch:
  - platform: gpio
    id: relay0
    name: ${name}_relay0
    pin: ${relay0_pin}
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - binary_sensor.template.publish:
          id: relay0_state
          state: true
    on_turn_off:
      - binary_sensor.template.publish:
          id: relay0_state
          state: false

  - platform: gpio
    id: relay1
    name: ${name}_relay1
    pin: ${relay1_pin}
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - binary_sensor.template.publish:
          id: relay1_state
          state: true
    on_turn_off:
      - binary_sensor.template.publish:
          id: relay1_state
          state: false

sensor:
  - platform: bme280_i2c
    address: 0x76
    update_interval: 30s
    temperature:
      name: ${name}_temperature
      id: bme280_temperature
      oversampling: 16x
    pressure:
      name: ${name}_pressure
      id: bme280_pressure
    humidity:
      name: ${name}_humidity
      id: bme280_humidity
