packages:

  hmsw1:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_hmsw-1t.yaml'
        vars:
          hmsw_id: 'hmsw1'
          hmsw_name: 'hmsw1'
          hmsw_ip_address: '192.168.1.50'
          hmsw_ip_port: 10081
          hmsw_poll_interval: '30s'
          hmsw_heartbeat_interval: '60s'
          hmsw_data_source: 'real_data_new'
          hmsw_alarm_poll_interval: '10min'
          hmsw_data_reboot_threshold: 10
          hmsw_stale_data_metric: 'ac_voltage'
          


