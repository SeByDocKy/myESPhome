    internal: true

  - platform: template
    id: cmd_slave4_relay0
    internal: true

  - platform: template
    id: cmd_slave4_relay1
    internal: true

  - platform: status
    name: ${name}_status


button:
  - platform: restart
    name: ${name}_restart            


switch:
  - platform: template
    name: ${name}_slave0_relay0
    id: switch_slave0_relay0
    lambda: |-
      return id(remote_relay0_state_0).state;
    turn_on_action:
      - binary_sensor.template.publish:
          id: cmd_slave0_relay0
          state: true
    turn_off_action:
      - binary_sensor.template.publish:
          id: cmd_slave0_relay0
          state: false
          
