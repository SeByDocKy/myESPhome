    remote_id: relay0_state
    id: remote_relay0_state_4
    internal: true

  - platform: packet_transport
    provider: meshcore-slave-4
    remote_id: relay1_state
    id: remote_relay1_state_4
    internal: true

  # Etat VOULU de chaque relais, diffuse aux slaves via packet_transport
  # (voir switch: plus bas, qui met a jour ces binary_sensor au lieu
  # d'envoyer un texte GRP_TXT).
  
  - platform: template
    id: cmd_slave0_relay0
    internal: true

  - platform: template
    id: cmd_slave0_relay1
    internal: true

  - platform: template
    id: cmd_slave1_relay0
    internal: true

  - platform: template
    id: cmd_slave1_relay1
    internal: true

  - platform: template
    id: cmd_slave2_relay0
    internal: true

  - platform: template
    id: cmd_slave2_relay1
    internal: true

  - platform: template
    id: cmd_slave3_relay0
