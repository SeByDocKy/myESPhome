##############################################################################
substitutions:
  name: "meshcore-master"
  master_name: "home"
  master_short_name: "HOME"
  master_public_key: "ac7PB9k9gcx0uYKNMXmSACLXvOmlfWHQNnepDRbGDhg="
  device_description: "Home master"

esphome:
  name: ${name}
  comment: ${device_description}
  min_version: 2026.5.0
  platformio_options:
    board_build.arduino.memory_type: qio_opi
    board_build.f_flash: 80000000L
    board_build.flash_mode: qio
  on_boot:
    priority: -100     # s'exécute après que tous les composants matériels (SPI, sx126x) soient prêts
    then:
      - delay: 2s  

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  cpu_frequency: 240Mhz
  toolchain: platformio
  framework:
    type: esp-idf
    version: 'dev'


external_components:
  - source: "github://SeByDocKy/myESPhome/"
    components: [meshcore]  
    refresh: 0s

  # - source:
      # type: local
      # path: components
    # components: [meshcore]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "base-maison-fallback"
    password: !secret ap_password

api:
  batch_delay: 50ms

ota:
  - platform: esphome

 
logger:
  level: verbose

spi:
  - id: spi_bus0
    mosi_pin: GPIO09
    miso_pin: GPIO08
    clk_pin: GPIO07
    interface: spi3

sx126x:
  id: lora_radio
  spi_id: spi_bus0
  dio1_pin: GPIO39
  busy_pin: GPIO40
  rst_pin: GPIO42
  cs_pin: GPIO41
  pa_power: 22
  bandwidth: 62_5kHz
  crc_enable: true
  frequency: 869618000
  modulation: LORA
  hw_version: sx1262
  rf_switch: true
  sync_value: [0x14, 0x24]
  preamble_size: 16
  spreading_factor: 8
  coding_rate: CR_4_8
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  data_rate: '10MHz'

 
meshcore:
  - id: id_mesh
    lora: lora_radio
    node_name: ${master_name}
    hop_limit: 3
    channels:
      - name: !secret meshcore_channel_name
        psk: !secret meshcore_channel_psk
    # Plus de "on_packet:" : tout passe desormais par "packet_transport"
    # ci-dessous, dans les deux sens (telemetrie et etat des relais recus
    # des slaves, commandes des relais diffusees vers les slaves).

# --- Telemetrie + etat des relais recus de chaque slave, ET commandes des
# relais diffusees vers eux, le tout via packet_transport / GRP_DATA ---
# "providers:" doit correspondre exactement au esphome.name de chaque slave
# (pas au node_name: du bloc meshcore:). Suppose des slaves nommes
# "meshcore-slave-0" a "meshcore-slave-4" (a adapter sinon).
# "binary_sensors:" = ce que CE master diffuse vers les slaves : l'etat
# VOULU de chaque relais (voir binary_sensor "cmd_slaveS_relayR" plus bas,
# mis a jour directement par les actions turn_on/turn_off des switches).


packet_transport:
  - platform: meshcore
    meshcore_id: id_mesh
    channel: !secret meshcore_channel_name
    update_interval: 10s
    providers:
      - name: meshcore-slave-0
      - name: meshcore-slave-1
      - name: meshcore-slave-2
      - name: meshcore-slave-3
      - name: meshcore-slave-4
    binary_sensors:
      - cmd_slave0_relay0
      - cmd_slave0_relay1
      - cmd_slave1_relay0
      - cmd_slave1_relay1
      - cmd_slave2_relay0
      - cmd_slave2_relay1
      - cmd_slave3_relay0
      - cmd_slave3_relay1
      - cmd_slave4_relay0
      - cmd_slave4_relay1

sensor:

  - platform: wifi_signal
    name: ${name}_wifi_power
    update_interval: 60s

  - platform: packet_transport
    provider: meshcore-slave-0
    internal: false
    remote_id: bme280_temperature
    name: ${name}_slave0_temperature
    id: remote_temp_0
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

