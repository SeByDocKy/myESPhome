substitutions:
  name: "test_deyemi"
  my_hours: '23'
  my_minute: '59'
  my_second: '59'

esphome:
  name: ${name}
  min_version: 2026.7.0

esp32:
  #board: esp32-s3-devkitc-1
  board: esp32dev
  cpu_frequency: 240Mhz
  # toolchain: platformio
  framework:
    type: esp-idf
    version: 'dev'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  batch_delay: 50ms

ota:
  - platform: esphome

time:
  - platform: sntp
    id: my_time

logger:
  # hardware_uart: USB_SERIAL_JTAG
   level: debug #debug

debug:
  update_interval: 5s


packages:
    
  sun1000g3:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_deyemi-2t.yaml'
        vars:
          deyemi_id: 'sun1000g3'
          deyemi_name: 'sun1000g3'
          deyemi_ip_address: '192.168.1.50'
          deyemi_ip_port: 8899
          deyemi_modbus_address: 1
          deyemi_sn: !secret sun1000g3_sn1 
          deyemi_poll_interval: '3s'

sensor:

  - platform: wifi_signal
    name: ${name}_wifi_power
    id: wifi_power
    update_interval: 5s

  - platform: uptime
    id: uptime_sec

  - platform: debug
    free:
      name: ${name}_heap_free
    loop_time:
      name: ${name}_loop_time
