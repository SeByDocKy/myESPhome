substitutions:
  name: "bd_pcm"
  name_controller: "lora_meter"
  device_description: "Bidirectional battery AC coupling "
  my_hours: '23'
  my_minute: '59'
  my_second: '59'
  baud_rate: 115200 #9600 ### JKPBBMS baudrate : if UART1 protocol = 001, set baud_rate=115200, if UART1 protocol = 013, set baud_rate=9600
  shelly_ip_address: '192.168.1.45'
  shelly_ip_port: '502'
  shelly_modbus_address: '1'
  shelly_update_interval: '1500ms'
  bms_modbus_address: '1'
  
  
globals:
  - id: phase_choice
    type: int
    restore_value: yes
    initial_value: '1'

  - id: shelly_ip_address_global
    type: std::string
    restore_value: yes
    initial_value: '"${shelly_ip_address}"'
    max_restore_data_length: 24    
  
esphome:
  name: ${name}
  comment: ${device_description}
  min_version: 2025.10.1
  platformio_options:
    # build_flags: -DBOARD_HAS_PSRAM
    board_build.arduino.memory_type: qio_opi
    board_build.f_flash: 80000000L
    board_build.flash_mode: qio
  
  on_boot:
    - priority: -100.0
      then:
        - text.set:
            id: ha_shelly_ip_address
            value: !lambda return ( id(shelly_ip_address_global) );
            
        - text_sensor.template.publish:
            id: current_shelly_ip_address
            state: !lambda return ( id(shelly_ip_address_global) );

   
esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  cpu_frequency: 240Mhz
  toolchain: platformio
  framework:
    type: esp-idf
    version: 'dev'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "battery_bidirectional"
    password: !secret ap_password
    
    
http_request:
  useragent: ESPHome-Update-Checker
  follow_redirects: true
 
update:
  - platform: http_request
    name: ${name}_MAJ_firmware
    id: github_firmware_update
    icon: "mdi:github"
    source: "https://raw.githubusercontent.com/SeByDocKy/myESPhome/main/firmwares/pcm_bidirectionnal/bd_pcm_shellypro3em/manifest.json" #?v=1.0.4
    # Fréquence de vérification automatique
    update_interval: 1h    

   
external_components:
  # - source: github://creepystefan/esphome_tcp
    # # components: [modbustcp, modbustcp_controller]
    # refresh: 0s 
    
  - source: "github://SeByDocKy/myESPhome/"
    components: [modbustcp, modbustcp_controller]
    refresh: 10s  
  
  
modbustcp:
  - id: modbus_tcp
    host: ${shelly_ip_address}
    port: ${shelly_ip_port}
    send_wait_time: 100ms  
  
modbustcp_controller:
  - id: modbus_device_tcp
    modbustcp_id: modbus_tcp
    address: ${shelly_modbus_address}
    update_interval: 2s   #default 60sec

uart: 
  - id: uart_0
    tx_pin: GPIO43 #GPIO43
    rx_pin: GPIO44 #GPIO44
    baud_rate: ${baud_rate}
    parity: none
    data_bits: 8
    stop_bits: 1

modbus:
  - id: modbus_rtu
    uart_id: uart_0
    send_wait_time: 50ms    
       
time:
  - platform: sntp
    id: my_time    

api:
  batch_delay: 50ms

ota:
  - platform: esphome
  
  - platform: http_request
    id: http_ota
  
logger:
  # hardware_uart: USB_SERIAL_JTAG
   level: verbose
    
spi:

 #### when connected with the B2B connector (no change vs direct wiring)
  - id: shared_spi
    mosi_pin: GPIO09
    miso_pin: GPIO08
    clk_pin: GPIO07
    interface: spi3

debug:
  update_interval: 5s
  
  
 
select:
  - platform: template
    name: ${name}_phase_select
    id: phase_select
    icon: mdi:power
    optimistic: false #true
    restore_value: true
    initial_option: 'p1'
    options:
      - 'p1'
      - 'p2'
      - 'p3'
      - 'p1+p2+p3'
    on_value:
      then:
        - globals.set:
           id: phase_choice
           value: !lambda |- 
             auto index = id(phase_select).active_index();
             return (index.value()+1);
             
        - lambda: |-
            id(active_power).update();
     

sensor:

  - platform: template
    id: active_power
    name: ${name}_active_power
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
    icon: mdi:flash
    unit_of_measurement: 'W'
    update_interval: ${shelly_update_interval}
    lambda: |-
      uint16_t reg_address;
      switch (id(phase_choice)) {
        case 2: reg_address = 1025; break;  // p1
        case 3: reg_address = 1045; break;  // p2
        case 4: reg_address = 1065; break;  // p3
        default: reg_address = 1014; break; // p1+p2+p3 (total)
      }
      auto *controller = id(modbus_device_tcp);

      auto command = esphome::modbustcp_controller::ModbusCommandItem::create_read_command(
          controller,
          esphome::modbustcp_controller::ModbusRegisterType::READ,
          reg_address,
          2,  // FP32 = 2 registres 16 bits
          [](esphome::modbustcp_controller::ModbusRegisterType register_type,
             uint16_t start_address,
             const std::vector<uint8_t> &data) {
            if (data.size() < 4) return;
            uint32_t raw = (uint32_t(data[0]) << 24) | (uint32_t(data[1]) << 16) |
                           (uint32_t(data[2]) << 8)  |  uint32_t(data[3]);
            float value;
            memcpy(&value, &raw, sizeof(value));
            id(active_power).publish_state(value);
          });

      controller->queue_command(command);
      return {};

