# BLUETTI Balco 500 (Modbus TCP).
# Start read-only: compare the readings with the BLUETTI app before using any switch / number / select.
# Enable "Modbus TCP" on the device web page (Settings -> Modbus TCP, port 502). Modbus TCP goes through the
# serial-over-TCP components of ESPHome PRs #20061 and #20198 (not merged yet: their syntax is the one announced for
# them).
# The controls are written with function code 06. The switches do not restore any state at boot.

substitutions:
  name: test_balco500_tcp
  bluetti_ip: '192.168.1.50'
  bluetti_port: '502'

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

debug:
  update_interval: 5s

time:
  - platform: sntp
    id: my_time

external_components:
  - source: github://pr#20061
    components: [modbus_tcp_uart]
    refresh: 1h
  - source: github://pr#20198
    components: [ble_nus, tcp_uart, uart, usb_cdc_acm, usb_uart]
    refresh: 1h
  # - source: github://SeByDocKy/myESPhome
    # components: [bluetti]

tcp_uart:
  - id: bluetti_link
    host: ${bluetti_ip}
    port: ${bluetti_port}

modbus_tcp_uart:
  - id: bluetti_uart
    tcp_uart_id: bluetti_link

packages:

  modbus_0:
    url: https://github.com/SeByDocKy/pvbrain2/
    ref: main
    refresh: 0s
    files:
      - path: 'pvbrain2/base/device_modbus.yaml'
        vars:
          modbus_id: 'modbus_0'
          modbus_uart_id: bluetti_uart
          modbus_send_wait_time: '100ms'
          modbus_turnaround_time: '100ms'

  balco500:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_bluetti_balco500.yaml'
        vars:
          bluetti_name: 'balco500'
          bluetti_id: 'balco500_hub'
          bluetti_modbus_controller: 'modbus_0'
          bluetti_modbus_address: '1'
          bluetti_fast_update_interval: '5s'
          bluetti_slow_update_interval: '60s'

sensor:
  - platform: wifi_signal
    name: ${name}_wifi_power
    id: wifi_power
    update_interval: 5s

  - platform: uptime
    id: uptime_sec

  - platform: debug
    free:
      name: ${name}_heap_free
    loop_time:
      name: ${name}_loop_time

text_sensor:
  - platform: template
    name: ${name}_uptime
    lambda: |-
      int seconds = (id(uptime_sec).state);
      int days = seconds / (24 * 3600);
      seconds = seconds % (24 * 3600);
      int hours = seconds / 3600;
      seconds = seconds % 3600;
      int minutes = seconds /  60;
      seconds = seconds % 60;
      if ( days ) {
        return { (std::to_string(days) +"d " + std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( hours ) {
        return { (std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( minutes ) {
        return { (std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else {
        return { (std::to_string(seconds) +"s ").c_str() };
      }
    icon: mdi:clock-start
    update_interval: 113s
