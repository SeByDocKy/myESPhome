substitutions:
  name: "test_tsungen3"

esphome:
  name: ${name}
  min_version: 2026.7.0

esp32:
  #board: esp32-s3-devkitc-1
  board: esp32dev
  cpu_frequency: 240Mhz
  # toolchain: platformio
  framework:
    type: esp-idf
    version: 'dev'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  batch_delay: 50ms

ota:
  - platform: esphome


external_components:

  - source: "github://SeByDocKy/myESPhome/"
    components: [tsungen3]
    refresh: 10s

  # - source:
      # type: local
      # path: components

logger:
  # hardware_uart: USB_SERIAL_JTAG
   level: debug #debug

debug:
  update_interval: 5s


tsungen3:
  - id: mx1000
    ip_address: 192.168.1.81   # adresse IP fixe de l'onduleur MX1000
    ip_port: 8899               # port client_mode (TCP clair)
    poll_interval: 5s
    modbus_address: 1
    sn: 3455843077 #2093984xxx  # décommenter si l'onduleur ne répond pas avec 0

  # Deuxième onduleur GEN3 PLUS sur le même ESP (MULTI_CONF) :
  # - id: tsungen3_2
  #   ip_address: 192.168.1.51
  #   poll_interval: 30s


sensor:

  - platform: wifi_signal
    name: ${name}_wifi_power
    id: wifi_power
    update_interval: 5s

  - platform: uptime
    id: uptime_sec

  - platform: debug
    free:
      name: ${name}_heap_free
    loop_time:
      name: ${name}_loop_time

  - platform: tsungen3
    tsungen3_id: mx1000
    dc_channels:
      - pv0:
          voltage:
            name: ${name}_pv1_voltage
          current:
            name: ${name}_pv1_current
          power:
            name: ${name}_pv1_power
      - pv1:
          voltage:
            name: ${name}_pv2_voltage
          current:
            name: ${name}_pv2_current
          power:
            name: ${name}_pv2_power
      - pv2:
          voltage:
            name: ${name}_pv3_voltage
          current:
            name: ${name}_pv3_current
          power:
            name: ${name}_pv3_power
      - pv3:
          voltage:
            name: ${name}_pv4_voltage
          current:
            name: ${name}_pv4_current
          power:
            name: ${name}_pv4_power
    ac:
      voltage:
        name: ${name}_grid_voltage
      current:
        name: ${name}_grid_current
      frequency:
        name: ${name}_grid_frequency
      power:
        name: ${name}_current_power
      energy_today:
        name: ${name}_ac_energy_today
      energy_total:
        name: ${name}_ac_energy_total
    inverter:
      temperature:
        name: ${name}_temperature
      rated_power:
        name: ${name}_rated_power

text_sensor:
  - platform: tsungen3
    tsungen3_id: mx1000
    inverter_status:
      name: ${name}_inverter_status
    event_alarms:
      name: ${name}_event_alarms
    event_faults:
      name: ${name}_event_faults

number:
  - platform: tsungen3
    tsungen3_id: mx1000
    power_percent:
      name: ${name}_power_percent

output:
  - platform: tsungen3
    tsungen3_id: mx1000
    power_percent:
      id: ${name}_power_percent_output

button:
  - platform: tsungen3
    tsungen3_id: mx1000
    reset_tsungen3:
      name: ${name}_reset_tsungen3
