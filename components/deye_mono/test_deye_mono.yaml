substitutions:
  name: "test_deye_mono"
  # Hour of the day at which the "today" energies are copied to the "yesterday" ones
  my_hours: "23"
  my_minute: "59"
  my_second: "30"

esphome:
  name: ${name}
  min_version: 2026.9.0

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240Mhz
  framework:
    type: esp-idf
    version: 'dev'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  batch_delay: 50ms

ota:
  - platform: esphome


external_components:

  - source: "github://SeByDocKy/myESPhome/"
    components: [deye_mono]
    refresh: 10s

  # Local checkout instead (e.g. while developing the component itself):
  # - source:
  #     type: local
  #     path: components
  #   components: [deye_mono]


logger:
  level: debug

debug:
  update_interval: 5s

time:
  - platform: homeassistant
    id: my_time
    on_time:
      # Total energy part (stays in YAML, not in the component): remember the "today" energies at the end of the day
      - seconds: ${my_second}
        minutes: ${my_minute}
        hours: ${my_hours}
        then:
          - globals.set:
              id: pv_energy_total_yesterday_global
              value: !lambda return id(pv_energy_total_today).state;
          - globals.set:
              id: ac_output_energy_yesterday_global
              value: !lambda return id(ac_output_energy_today).state;
          - globals.set:
              id: battery_charging_energy_yesterday_global
              value: !lambda return id(battery_charging_energy_today).state;
          - globals.set:
              id: battery_discharging_energy_yesterday_global
              value: !lambda return id(battery_discharging_energy_today).state;

globals:
  - id: pv_energy_total_yesterday_global
    type: float
    restore_value: yes
  - id: ac_output_energy_yesterday_global
    type: float
    restore_value: yes
  - id: battery_charging_energy_yesterday_global
    type: float
    restore_value: yes
  - id: battery_discharging_energy_yesterday_global
    type: float
    restore_value: yes


# ---------------------------------------------------------------------------
# Modbus: the bus, and the ONE controller (and so the one update_interval) that polls the inverter
# ---------------------------------------------------------------------------
uart:
  id: uart_inverter
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  stop_bits: 1

modbus:
  id: modbus_inverter
  uart_id: uart_inverter
  # flow_control_pin: GPIO16        # RS485 module with a DE/RE pin

modbus_controller:
  - id: deye_controller
    modbus_id: modbus_inverter
    address: 1
    setup_priority: -10
    update_interval: 10s

# ---------------------------------------------------------------------------
# The inverter: every entity below comes from the component. Remove the lines you do not need.
# ---------------------------------------------------------------------------
deye_mono:
  - id: deye
    modbus_controller_id: deye_controller
    inverter_factor: 1.0          # multiplier of every power value (was ${inverter_factor})
    # use_write_multiple: true    # write with function 0x10 (default) or 0x06
    # write_hold: 5s              # values read back are ignored this long after a write

