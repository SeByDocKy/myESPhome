substitutions:
  name: ez1m

esphome:
  name: ${name}
  friendly_name: APsystems EZ1

esp32:
  board: esp32-c2-devkitm-1
  variant: esp32c2
  toolchain: platformio
  framework:
    type: esp-idf
    version: 'dev'
    sdkconfig_options:
      CONFIG_XTAL_FREQ_26: "y"

logger:

api:
  # encryption:
    # key: !secret api_key

ota:
  - platform: esphome
    # password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "APsystems-EZ1-Fallback"
    password: 'e-2-nomy'

captive_portal:

debug:
  update_interval: 5s


############## BE AWARE CURRENTLY time component with sntp platform makes crashing the ESP32-C2 nand enter into safe mode ######
############# so don't use  it unntil it's fixed by ESPhome #############"
# time:
#   - platform: sntp
#     id: my_time  
  
sensor:

  - platform: debug
    free:
      name: ${name}_heap_free
    loop_time:
      name: ${name}_loop_time

  - platform: wifi_signal
    name: ${name}_wifi_signal
    update_interval: 60s
    
  - platform: uptime
    name: ${name}_uptime
    id: uptime_sec
    
    
text_sensor:
 
  - platform: wifi_info
    ip_address:
      name: ${name}_ip_address
      
      
  - platform: template
    name: ${name}_uptime
    lambda: |-
      int seconds = (id(uptime_sec).state);
      int days = seconds / (24 * 3600);
      seconds = seconds % (24 * 3600); 
      int hours = seconds / 3600;
      seconds = seconds % 3600;
      int minutes = seconds /  60;
      seconds = seconds % 60;
      if ( days ) {
        return { (std::to_string(days) +"d " + std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( hours ) {
        return { (std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( minutes ) {
        return { (std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else {
        return { (std::to_string(seconds) +"s ").c_str() };
      }  
    icon: mdi:clock-start
    update_interval: 113s      

button:
  - platform: restart
    name: ${name}_restart    
    
packages:

  ez1m:
    url: https://github.com/SeByDocKy/myESPhome/
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_ez1m.yaml'
        vars:
          ez1m_id: 'ez1'
          ez1m_name: 'ez1m1'
          ez1m_update_interval: '1500ms'
          
          
