# EcoFlow STREAM 5000 (Modbus TCP).
# Start read-only: compare the readings with the EcoFlow app before uncommenting the controls of
# code/device_ecoflow_stream5000.yaml.
# Enable Modbus TCP in the EcoFlow app (device integration -> third-party control; "View only" is enough to read).
# Modbus TCP goes through ESPHome PRs #20061 and #20198 (not merged yet). When written, they compiled with
# ESPHome 2026.12.0-dev, NOT with 2026.11.1.

substitutions:
  name: test_ecoflow_stream5000
  ecoflow_ip: '192.168.1.50'
  ecoflow_port: '502'

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

debug:
  update_interval: 5s

time:
  - platform: sntp
    id: my_time

external_components:
  - source: github://pr#20061
    components: [modbus_tcp_uart]
    refresh: 1h
  - source: github://pr#20198
    components: [ble_nus, tcp_uart, uart, usb_cdc_acm, usb_uart]
    refresh: 1h
  # - source: github://SeByDocKy/myESPhome
    # components: [ecoflow_stream]

tcp_uart:
  - id: ecoflow_link
    host: ${ecoflow_ip}
    port: ${ecoflow_port}

modbus_tcp_uart:
  - id: ecoflow_uart
    tcp_uart_id: ecoflow_link

packages:

  modbus_0:
    url: https://github.com/SeByDocKy/pvbrain2
    ref: main
    refresh: 0s
    files:
      - path: 'pvbrain2/base/device_modbus.yaml'
        vars:
          modbus_id: 'modbus_0'
          modbus_uart_id: ecoflow_uart
          modbus_send_wait_time: '100ms'
          modbus_turnaround_time: '100ms'

  ecoflow_s5k:
    url: https://github.com/SeByDocKy/myESPhome
    ref: main
    refresh: 0s
    files:
      - path: 'code/device_ecoflow_stream5000.yaml'
        vars:
          ecoflow_name: 's5k'
          ecoflow_id: 's5k_hub'
          ecoflow_modbus_controller: 'modbus_0'
          ecoflow_modbus_address: '1'
          ecoflow_fast_update_interval: '5s'
          ecoflow_slow_update_interval: '60s'

sensor:
  - platform: wifi_signal
    name: ${name}_wifi_power
    id: wifi_power
    update_interval: 5s

  - platform: uptime
    id: uptime_sec

  - platform: debug
    free:
      name: ${name}_heap_free
    loop_time:
      name: ${name}_loop_time

text_sensor:
  - platform: template
    name: ${name}_uptime
    lambda: |-
      int seconds = (id(uptime_sec).state);
      int days = seconds / (24 * 3600);
      seconds = seconds % (24 * 3600);
      int hours = seconds / 3600;
      seconds = seconds % 3600;
      int minutes = seconds /  60;
      seconds = seconds % 60;
      if ( days ) {
        return { (std::to_string(days) +"d " + std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( hours ) {
        return { (std::to_string(hours) +"h " + std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else if ( minutes ) {
        return { (std::to_string(minutes) +"m "+ std::to_string(seconds) +"s ").c_str() };
      } else {
        return { (std::to_string(seconds) +"s ").c_str() };
      }
    icon: mdi:clock-start
    update_interval: 113s
